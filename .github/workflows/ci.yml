name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: onnx-minilm-l6-v2
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Build in-browser demo
        run: python scripts/build_demo.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
